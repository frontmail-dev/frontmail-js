name: Publish

# Every push to main (= every sync from the monorepo) publishes the package versions that are not
# on npm yet – nothing happens when the versions did not change. Versions are bumped in the
# monorepo ("Version packages" PR), never here.
#
# Two jobs, so that no dependency code ever runs next to publishing credentials:
#   build    – no secrets, read-only token: frozen install, build, test, `pnpm pack` of the
#              versions missing on npm → artifact `tarballs` (+ manifest.json).
#   publish  – environment `npm-publish` (protect it: required reviewers, branch `main` only).
#              Runs no package code: checks each tarball's name + version against package.json
#              and runs `npm publish <tarball> --provenance`, then creates tags + GitHub releases.
#
# Auth: npm Trusted Publishing (OIDC, `id-token: write` only in the publish job). Configure the
# trusted publisher on npmjs.com with repository frontmail-dev/frontmail-js, workflow publish.yml,
# environment npm-publish. Fallback only for the FIRST publish of a new package (npm cannot attach
# a trusted publisher to a package that does not exist yet): a short-lived NPM_TOKEN secret in the
# `npm-publish` environment – delete it right after (README of the monorepo → Releasing SDKs).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Build, test, pack
    # Never from forks.
    if: github.repository == 'frontmail-dev/frontmail-js'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      count: ${{ steps.pack.outputs.count }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Pack versions not yet on npm
        id: pack
        run: node scripts/publish-new.mjs --pack "$RUNNER_TEMP/tarballs"
      - name: Upload tarballs
        if: steps.pack.outputs.count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    if: needs.build.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: write # tags + GitHub releases
      id-token: write # npm Trusted Publishing + provenance
    steps:
      # Only for package.json versions, CHANGELOG notes and scripts/publish-new.mjs – nothing is
      # installed or built here.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Update npm (Trusted Publishing needs npm >= 11.5.1)
        run: npm install -g npm@11.20.0 # pinned; bump deliberately
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # setup-node's .npmrc references NODE_AUTH_TOKEN; it stays empty unless the first-publish
          # fallback token exists. Otherwise npm uses OIDC (Trusted Publishing).
          if [ -n "$NPM_TOKEN" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
            echo "::warning::Publishing with the NPM_TOKEN secret – configure Trusted Publishing on npmjs.com and delete the secret."
          fi
          node scripts/publish-new.mjs --from "$RUNNER_TEMP/tarballs"
